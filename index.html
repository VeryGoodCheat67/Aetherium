<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aetherium</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/VeryGoodCheat67/Aetherium/main/misc/aetherium.png">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            background: #000;
            overflow-x: hidden;
        }

        body {
            min-height: 100%;
            scrollbar-width: none;
            background: #000;
            color: #fff;
            font-family: "Cascadia Code", "SF Mono", monospace;
            overflow-x: hidden;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 90% 55% at 50% 0%, rgba(255,255,255,0.04) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 50% 50%, rgba(255,255,255,0.012), transparent 65%);
            animation: ambientPulse 9s ease-in-out infinite;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 620px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .hero::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 46%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.028) 0%, transparent 70%);
            pointer-events: none;
            filter: blur(30px);
        }

        .hero-gif {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(500px, 72vw);
            height: min(500px, 72vw);
            object-fit: contain;
            transform: translate(-50%, -50%);
            opacity: 0.18;
            pointer-events: none;
            user-select: none;
            filter: brightness(0.7) blur(0.4px);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: clamp(58px, 9vw, 96px);
            font-weight: 600;
            letter-spacing: -5px;
            line-height: 0.94;
            background: linear-gradient(170deg, #ffffff 0%, #888 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateY(52px);
            animation: riseIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
            transition: font-size 0.4s cubic-bezier(0.16, 1, 0.3, 1), letter-spacing 0.4s ease;
            display: inline-block;
        }

        .title:hover {
            font-size: clamp(62px, 9.8vw, 105px);
            letter-spacing: -4,5px;
        }

        .subtitle {
            margin-top: 22px;
            font-size: 12px;
            color: #383838;
            letter-spacing: 0.3px;
            line-height: 1.6;
            opacity: 0;
            transform: translateY(16px);
            animation: riseIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        }

        .scroll-button {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #323232;
            font-size: 10px;
            letter-spacing: 0.5px;
            opacity: 0;
            animation: fadeIn 1s ease 1.3s forwards;
            transition: color 0.4s ease, opacity 0.55s ease, transform 0.55s ease;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
        }

        .scroll-button:hover {
            color: #777;
        }

        .scroll-button.hidden {
            opacity: 0 !important;
            pointer-events: none;
            transform: translateX(-50%) translateY(12px);
        }

        .arrow-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .arrow {
            width: 7px;
            height: 7px;
            border-right: 1px solid currentColor;
            border-bottom: 1px solid currentColor;
            transform: rotate(45deg);
        }

        .arrow:nth-child(1) { opacity: 0.25; animation: cascadeArrow 2s ease-in-out infinite; }
        .arrow:nth-child(2) { opacity: 0.55; animation: cascadeArrow 2s ease-in-out 0.18s infinite; }
        .arrow:nth-child(3) { opacity: 1;    animation: cascadeArrow 2s ease-in-out 0.36s infinite; }

        .preview {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 130px 24px 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .preview::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 90px;
            background: linear-gradient(to bottom, transparent, #222 55%, transparent);
        }

        .preview h2 {
            font-size: clamp(34px, 5vw, 54px);
            font-weight: 500;
            letter-spacing: -2.8px;
            line-height: 1.02;
            background: linear-gradient(170deg, #fff 0%, #777 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.85s cubic-bezier(0.16,1,0.3,1), transform 0.85s cubic-bezier(0.16,1,0.3,1);
        }

        .description {
            color: #3c3c3c;
            font-size: 11.5px;
            line-height: 1.75;
            max-width: 300px;
            margin-bottom: 0;
            opacity: 0;
            transform: translateY(22px);
            transition: opacity 0.85s cubic-bezier(0.16,1,0.3,1) 0.1s, transform 0.85s cubic-bezier(0.16,1,0.3,1) 0.1s;
        }

        .description i {
            color: #555;
            font-style: italic;
        }

        .code-container {
            width: min(880px, 96%);
            margin-top: 56px;
            opacity: 0;
            transform: translateY(38px) scale(0.988);
            transition:
                opacity 1s cubic-bezier(0.16,1,0.3,1) 0.2s,
                transform 1s cubic-bezier(0.16,1,0.3,1) 0.2s;
        }

        .code-container::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 60px;
            background: radial-gradient(ellipse, rgba(255,255,255,0.025), transparent 70%);
            filter: blur(20px);
            pointer-events: none;
        }

        .code-box {
            position: relative;
            width: 100%;
            padding: 20px 20px 20px 26px;
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(7,7,7,0.95);
            border: 1px solid #1e1e1e;
            border-radius: 14px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03) inset,
                0 1px 0 rgba(255,255,255,0.05) inset,
                0 30px 70px rgba(0,0,0,0.6);
            backdrop-filter: blur(24px);
            transition:
                border-color 0.4s ease,
                transform 0.4s ease,
                box-shadow 0.4s ease;
        }

        .code-box:hover {
            border-color: #2a2a2a;
            transform: translateY(-2px);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.042) inset,
                0 1px 0 rgba(255,255,255,0.055) inset,
                0 40px 90px rgba(0,0,0,0.68);
        }

        .code {
            flex: 1;
            min-width: 0;
            text-align: left;
            white-space: nowrap;
            overflow-x: auto;
            font-family: inherit;
            font-size: 13px;
            line-height: 1.6;
            color: #999;
            scrollbar-width: none;
        }

        .code::-webkit-scrollbar {
            display: none;
        }

        .fn    { color: #c8c8c8; font-weight: 500; }
        .str   { color: #505050; letter-spacing: 0.1px; }
        .paren { color: #2e2e2e; }

        .copy-button {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #1f1f1f;
            border-radius: 9px;
            background: #0c0c0c;
            color: #555;
            cursor: pointer;
            transition:
                background 0.25s ease,
                color 0.25s ease,
                border-color 0.25s ease,
                transform 0.18s ease;
        }

        .copy-button:hover {
            background: #141414;
            color: #bbb;
            border-color: #2c2c2c;
        }

        .copy-button:active {
            transform: scale(0.9);
        }

        .copy-button.copied {
            color: #ddd;
            border-color: #353535;
        }

        .copy-icon {
            width: 15px;
            height: 15px;
            transition: transform 0.2s ease;
        }

        .copy-button.copied .copy-icon {
            transform: scale(1.1);
        }

        .reveal.in-view {
            opacity: 1 !important;
            transform: translateY(0) scale(1) !important;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(var(--ty, 30px)); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes cascadeArrow {
            0%, 55%, 100% { transform: rotate(45deg) translate(0, 0); }
            28%            { transform: rotate(45deg) translate(2.5px, 2.5px); }
        }

        @keyframes ambientPulse {
            0%, 100% { opacity: 0.5; }
            50%       { opacity: 1; }
        }

        @media (max-width: 600px) {
            .title { font-size: 54px; letter-spacing: -3.5px; }
            .title:hover { font-size: 60px; }
            .subtitle { font-size: 11px; }
            .code-box { padding: 15px 15px 15px 18px; gap: 10px; }
            .code { font-size: 10px; }
            .copy-button { width: 32px; height: 32px; }
            .copy-icon { width: 13px; height: 13px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <section class="hero" id="home">
        <img
            class="hero-gif"
            src="https://raw.githubusercontent.com/VeryGoodCheat67/Aetherium/main/misc/3daetherium.gif"
            alt=""
            aria-hidden="true"
        >
        <div class="hero-content">
            <div class="title">Aetherium</div>
            <p class="subtitle">the best script for rivals.</p>
        </div>
    </section>

    <button class="scroll-button" id="scrollBtn" aria-label="Scroll to preview">
        <span>scroll down</span>
        <div class="arrow-wrap">
            <div class="arrow"></div>
            <div class="arrow"></div>
            <div class="arrow"></div>
        </div>
    </button>

    <section class="preview" id="script">

        <h2 class="reveal">Ragebot</h2>

        <p class="description reveal">
            paste the loadstring into your executor and experience
            the <i>Aetherium</i> ragebot.
        </p>

        <div class="code-container reveal">
            <div class="code-box">
                <pre class="code"><span class="fn">loadstring</span><span class="paren">(</span><span class="str">"https://raw.githubusercontent.com/VeryGoodCheat67/Aetherium/refs/heads/main/src/ragebot.lua"</span><span class="paren">)</span></pre>
                <button class="copy-button" id="copyButton" aria-label="Copy loadstring" title="Copy">
                    <svg class="copy-icon" viewBox="0 0 24 24" fill="none">
                        <rect x="7" y="7" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/>
                        <path d="M17 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
        </div>

    </section>

    <script>
        const scrollBtn = document.getElementById("scrollBtn");
        scrollBtn.addEventListener("click", () => {
            document.getElementById("script").scrollIntoView({ behavior: "smooth" });
        });

        const preview = document.getElementById("script");
        const scrollObserver = new IntersectionObserver(
            ([entry]) => {
                scrollBtn.classList.toggle("hidden", entry.isIntersecting);
            },
            { threshold: 0.12 }
        );
        scrollObserver.observe(preview);

        const revealObserver = new IntersectionObserver(
            (entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("in-view");
                        revealObserver.unobserve(entry.target);
                    }
                });
            },
            { threshold: 0.1, rootMargin: "0px 0px -30px 0px" }
        );
        document.querySelectorAll(".reveal").forEach(el => revealObserver.observe(el));

        const heroGif = document.querySelector(".hero-gif");
        let ticking = false;
        window.addEventListener("scroll", () => {
            if (!ticking) {
                requestAnimationFrame(() => {
                    const progress = Math.min(window.scrollY / (window.innerHeight * 0.55), 1);
                    heroGif.style.opacity = 0.18 * (1 - progress * 0.9);
                    ticking = false;
                });
                ticking = true;
            }
        }, { passive: true });

        const copyButton = document.getElementById("copyButton");
        const loadstring = 'loadstring("https://raw.githubusercontent.com/VeryGoodCheat67/Aetherium/refs/heads/main/src/ragebot.lua")';

        const copyIcon = `<svg class="copy-icon" viewBox="0 0 24 24" fill="none">
            <rect x="7" y="7" width="13" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M17 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>`;

        const checkIcon = `<svg class="copy-icon" viewBox="0 0 24 24" fill="none">
            <path d="M5 12.5L9.5 17L19 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;

        copyButton.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(loadstring);
                copyButton.innerHTML = checkIcon;
                copyButton.classList.add("copied");
                setTimeout(() => {
                    copyButton.innerHTML = copyIcon;
                    copyButton.classList.remove("copied");
                }, 1800);
            } catch (err) {
                console.error("Copy failed:", err);
            }
        });
    </script>

</body>
</html>
