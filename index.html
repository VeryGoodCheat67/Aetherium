<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aetherium</title>

    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/VeryGoodCheat67/Aetherium/main/misc/aetherium.png">

    <style>
        * {
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        html {
            background: #000;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(255, 255, 255, 0.045),
                    transparent 35%
                ),
                #000;
            color: #fff;
            font-family: "Cascadia Code", monospace;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(
                circle at 50% 50%,
                rgba(255, 255, 255, 0.025),
                transparent 45%
            );
            animation: backgroundPulse 6s ease-in-out infinite;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: clamp(52px, 7vw, 82px);
            font-weight: 600;
            letter-spacing: -4px;
            line-height: 1;
            background: linear-gradient(
                180deg,
                #fff 0%,
                #c4c4c4 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateY(45px);
            animation: titleIn 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .subtitle {
            margin-top: 14px;
            font-size: 16px;
            color: #666;
            letter-spacing: -0.5px;
            opacity: 0;
            transform: translateY(20px);
            animation: subtitleIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        .scroll-button {
            position: absolute;
            bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: #4d4d4d;
            text-decoration: none;
            font-size: 11px;
            opacity: 0;
            animation: fadeIn 1s ease 1.1s forwards;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .scroll-button:hover {
            color: #aaa;
            transform: translateY(-3px);
        }

        .arrow {
            width: 9px;
            height: 9px;
            border-right: 1px solid #777;
            border-bottom: 1px solid #777;
            transform: rotate(45deg);
            animation: arrowBounce 1.8s ease-in-out infinite;
        }

        .preview {
            min-height: 100vh;
            padding: 130px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .preview h2 {
            margin: 0;
            font-size: clamp(30px, 4vw, 42px);
            font-weight: 500;
            letter-spacing: -2px;
            background: linear-gradient(
                180deg,
                #fff,
                #999
            );
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateY(25px);
            animation: sectionIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        .description {
            margin: 12px 0 0;
            color: #555;
            font-size: 13px;
            opacity: 0;
            transform: translateY(20px);
            animation: sectionIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        .code-container {
            width: min(850px, 95%);
            margin-top: 45px;
            opacity: 0;
            transform: translateY(30px);
            animation: sectionIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        .code-box {
            width: 100%;
            padding: 22px 22px 22px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(12, 12, 12, 0.85);
            border: 1px solid #1c1c1c;
            border-radius: 12px;
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.025);
            backdrop-filter: blur(12px);
            transition:
                border-color 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .code-box:hover {
            border-color: #292929;
            transform: translateY(-2px);
            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.035);
        }

        .code {
            flex: 1;
            margin: 0;
            text-align: left;
            white-space: nowrap;
            overflow-x: auto;
            font-family: "Cascadia Code", monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #b5b5b5;
            scrollbar-width: none;
        }

        .code::-webkit-scrollbar {
            display: none;
        }

        .function {
            color: #e2e2e2;
        }

        .url {
            color: #777;
        }

        .copy-button {
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #252525;
            border-radius: 7px;
            background: #111;
            color: #777;
            cursor: pointer;
            transition:
                background 0.25s ease,
                color 0.25s ease,
                border-color 0.25s ease,
                transform 0.2s ease;
        }

        .copy-button:hover {
            background: #181818;
            color: #ddd;
            border-color: #333;
        }

        .copy-button:active {
            transform: scale(0.92);
        }

        .copy-button.copied {
            color: #fff;
            border-color: #444;
        }

        .copy-icon {
            width: 17px;
            height: 17px;
            transition: transform 0.25s ease;
        }

        .copy-button.copied .copy-icon {
            transform: scale(1.1);
        }

        @keyframes titleIn {
            from {
                opacity: 0;
                transform: translateY(45px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes subtitleIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes sectionIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes arrowBounce {
            0%, 100% {
                transform: translateY(0) rotate(45deg);
            }

            50% {
                transform: translateY(6px) rotate(45deg);
            }
        }

        @keyframes backgroundPulse {
            0%, 100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .title {
                font-size: 52px;
            }

            .subtitle {
                font-size: 13px;
            }

            .code-box {
                padding: 16px;
                gap: 10px;
            }

            .code {
                font-size: 11px;
            }

            .copy-button {
                width: 34px;
                height: 34px;
            }

            .copy-icon {
                width: 15px;
                height: 15px;
            }
        }
    </style>
</head>

<body>

    <section class="hero" id="home">
        <div class="hero-content">
            <div class="title">Aetherium</div>

            <div class="subtitle">
                the best script for rivals.
            </div>
        </div>

        <a href="#script" class="scroll-button">
            <span>scroll to preview</span>
            <span class="arrow"></span>
        </a>
    </section>

    <section class="preview" id="script">

        <h2>Ragebot</h2>

        <p class="description">
            experience the <i>Aetherium</i> ragebot.
        </p>

        <div class="code-container">
            <div class="code-box">

                <pre class="code"><span class="function">loadstring</span>(<span class="url">"https://raw.githubusercontent.com/VeryGoodCheat67/Aetherium/refs/heads/main/src/ragebot.lua"</span>)</pre>

                <button
                    class="copy-button"
                    id="copyButton"
                    aria-label="Copy loadstring"
                    title="Copy"
                >
                    <svg
                        class="copy-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                    >
                        <rect
                            x="7"
                            y="7"
                            width="13"
                            height="13"
                            rx="2"
                            stroke="currentColor"
                            stroke-width="1.6"
                        />

                        <path
                            d="M17 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"
                            stroke="currentColor"
                            stroke-width="1.6"
                            stroke-linecap="round"
                        />
                    </svg>
                </button>

            </div>
        </div>

    </section>

    <script>
        const copyButton = document.getElementById("copyButton");

        const loadstring =
            'loadstring("https://raw.githubusercontent.com/VeryGoodCheat67/Aetherium/refs/heads/main/src/ragebot.lua")';

        const copyIcon = `
            <svg class="copy-icon" viewBox="0 0 24 24" fill="none">
                <rect
                    x="7"
                    y="7"
                    width="13"
                    height="13"
                    rx="2"
                    stroke="currentColor"
                    stroke-width="1.6"
                />

                <path
                    d="M17 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                />
            </svg>
        `;

        const checkIcon = `
            <svg class="copy-icon" viewBox="0 0 24 24" fill="none">
                <path
                    d="M5 12.5L9.5 17L19 7"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        `;

        copyButton.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(loadstring);

                copyButton.innerHTML = checkIcon;
                copyButton.classList.add("copied");

                setTimeout(() => {
                    copyButton.innerHTML = copyIcon;
                    copyButton.classList.remove("copied");
                }, 1800);

            } catch (error) {
                console.error("Copy failed:", error);
            }
        });
    </script>

</body>
</html>
